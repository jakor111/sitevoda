<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система мониторинга качества воды</title>
  
  <!-- Chart.js для графиков -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK (Compat версия для статического хостинга) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --primary: #2563eb; --success: #16a34a; --warning: #ca8a04; --danger: #dc2626; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: var(--primary); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    input, select { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 1px solid #cbd5e1; border-radius: 6px; }
    .hidden { display: none !important; }
    .status { padding: 0.5rem 1rem; border-radius: 6px; color: white; display: inline-block; margin-bottom: 0.5rem; }
    .status.normal { background: var(--success); }
    .status.warning { background: var(--warning); }
    .status.critical { background: var(--danger); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .param-card { padding: 1rem; border-left: 4px solid var(--success); background: #f1f5f9; border-radius: 0 8px 8px 0; }
    .param-card.warn { border-color: var(--warning); }
    .param-card.crit { border-color: var(--danger); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .chart-container { position: relative; height: 300px; margin: 1rem 0; }
    #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>
  <header>
    <h2>💧 Мониторинг качества воды</h2>
    <div id="header-controls" class="hidden">
      <span id="user-role"></span>
      <button id="btn-logout" class="btn btn-danger" style="margin-left: 1rem;">Выйти</button>
    </div>
    <button id="btn-login" class="btn btn-primary">Войти</button>
  </header>

  <div class="container">
    <!-- Модальное окно авторизации -->
    <div id="auth-modal" class="hidden">
      <div class="modal-content">
        <h3 id="auth-title">Вход в систему</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <select id="role-select" class="hidden">
          <option value="user">Пользователь</option>
          <option value="admin">Администратор</option>
        </select>
        <button id="auth-action" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Войти</button>
        <p style="margin-top:0.5rem; font-size:0.9rem; color:#64748b;">
          <span id="auth-switch-text">Нет аккаунта?</span>
          <a href="#" id="auth-switch-link">Зарегистрироваться</a>
        </p>
        <button id="close-modal" class="btn" style="margin-top:0.5rem; width:100%;">Закрыть</button>
      </div>
    </div>

    <!-- Панель пользователя -->
    <div id="user-view" class="hidden">
      <div class="card">
        <h3>📊 Сводка по водоёму</h3>
        <div id="user-status" class="status">Загрузка...</div>
        <div class="grid" id="user-params"></div>
        <h4 style="margin-top:1.5rem;">💡 Рекомендуемые меры</h4>
        <ul id="recommendations" style="margin-left:1.5rem; margin-top:0.5rem;"></ul>
      </div>
    </div>

    <!-- Панель администратора -->
    <div id="admin-view" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3>📈 Панель администратора</h3>
          <div>
            <button id="btn-emulator" class="btn btn-success">▶ Запустить эмулятор</button>
            <button id="btn-stop" class="btn btn-danger hidden">⏹ Остановить</button>
          </div>
        </div>
        <div class="grid">
          <div><canvas id="chart-temp"></canvas></div>
          <div><canvas id="chart-ph"></canvas></div>
          <div><canvas id="chart-nitrates"></canvas></div>
          <div><canvas id="chart-cod"></canvas></div>
        </div>
        <h4 style="margin-top:1rem;">📋 Последние показания</h4>
        <table id="data-table">
          <thead><tr><th>Время</th><th>pH</th><th>T°C</th><th>Нитраты</th><th>ХПК</th><th>Статус</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAca9gvSFLaOSldjLrlqVoez3PjilUN9S8",
  authDomain: "site-voda-vkr.firebaseapp.com",
  projectId: "site-voda-vkr",
  storageBucket: "site-voda-vkr.firebasestorage.app",
  messagingSenderId: "984009319014",
  appId: "1:984009319014:web:81f840ce8f2c5a37ef03a7"
};

    // 🔹 Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 📊 ЭМУЛЯТОР ДАННЫХ
    let emulatorInterval = null;
    const waterbody = "Нижний фермский пруд";
    
    function generateReading() {
      const t = new Date();
      const month = t.getMonth();
      const seasonalShift = Math.sin((month - 4) * Math.PI / 6) * 2;
      
      return {
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        waterbody,
        ph: 7.0 + (Math.random() * 1.5 - 0.75),
        temp: 12 + seasonalShift + (Math.random() * 8 - 4),
        nitrates: 10 + (Math.random() * 15),
        phosphates: 0.2 + (Math.random() * 1.4),
        cod: 15 + (Math.random() * 21),
        transparency: 30 + (Math.random() * 20),
        phytoplankton: 20 + (Math.random() * 60),
        heavy_metals: { Cu: 1 + Math.random()*10, Ni: 2 + Math.random()*15, Co: 0.5 + Math.random()*3 }
      };
    }

    function startEmulator() {
      document.getElementById('btn-emulator').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');
      emulatorInterval = setInterval(async () => {
        const data = generateReading();
        await db.collection('water_readings').add(data);
        updateAdminCharts(data);
        addUserTableRow(data);
      }, 5000);
    }

    function stopEmulator() {
      clearInterval(emulatorInterval);
      document.getElementById('btn-emulator').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
    }

    // 🎛 АДМИН-ПАНЕЛЬ: Графики
    const charts = {};
    function initCharts() {
      const config = (label, color) => ({
        type: 'line',
        data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: 0.3, fill: false }] },
        options: { responsive: true, maintainAspectRatio: false }
      });
      charts.temp = new Chart(document.getElementById('chart-temp'), config('Температура (°C)', '#ef4444'));
      charts.ph = new Chart(document.getElementById('chart-ph'), config('pH', '#3b82f6'));
      charts.nitrates = new Chart(document.getElementById('chart-nitrates'), config('Нитраты (мг/л)', '#10b981'));
      charts.cod = new Chart(document.getElementById('chart-cod'), config('ХПК (мг O₂/л)', '#f59e0b'));
    }

    function updateAdminCharts(data) {
      const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : new Date().toLocaleTimeString();
      ['temp', 'ph', 'nitrates', 'cod'].forEach(key => {
        const chart = charts[key];
        chart.data.labels.push(time);
        chart.data.datasets[0].data.push(key === 'temp' ? data.temp : data[key]);
        if(chart.data.labels.length > 20) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }
        chart.update();
      });
    }

    function addUserTableRow(data) {
      const tbody = document.querySelector('#data-table tbody');
      const row = document.createElement('tr');
      const status = checkStatus(data).overall;
      row.innerHTML = `<td>${new Date().toLocaleTimeString()}</td><td>${data.ph.toFixed(2)}</td><td>${data.temp.toFixed(1)}</td><td>${data.nitrates.toFixed(1)}</td><td>${data.cod.toFixed(1)}</td><td><span class="status ${status}">${status}</span></td>`;
      tbody.prepend(row);
      if(tbody.children.length > 10) tbody.removeChild(tbody.lastChild);
    }

    // 👤 ПОЛЬЗОВАТЕЛЬСКАЯ ПАНЕЛЬ: Проверка норм
    const thresholds = {
      ph: { min: 6.5, max: 8.5, norm: 'pH в норме', warn: 'Кислотность отклоняется', crit: 'Критическое значение pH' },
      nitrates: { min: 0, max: 45, norm: 'Нитраты в пределах ПДК', warn: 'Повышенное содержание', crit: 'Опасное превышение' },
      cod: { min: 0, max: 15, norm: 'ХПК в норме', warn: 'Высокая органическая нагрузка', crit: 'Сильное загрязнение' },
      phosphates: { min: 0, max: 3.5, norm: 'Фосфаты в норме', warn: 'Риск эвтрофикации', crit: 'Критический уровень' }
    };

    function checkStatus(data) {
      let overall = 'normal';
      const params = [];
      for(const [key, rule] of Object.entries(thresholds)) {
        const val = data[key];
        if(val > rule.max) {
          overall = overall === 'normal' ? 'warning' : overall;
          params.push({ key, status: 'crit', msg: rule.crit });
        } else if(val < rule.min || val > rule.max * 0.8) {
          overall = overall === 'normal' ? 'warning' : overall;
          params.push({ key, status: 'warn', msg: rule.warn });
        } else {
          params.push({ key, status: 'normal', msg: rule.norm });
        }
      }
      return { overall, params };
    }

    function renderUserView(data) {
      const { overall, params } = checkStatus(data);
      document.getElementById('user-status').className = `status ${overall}`;
      document.getElementById('user-status').textContent = overall === 'normal' 
        ? '✅ Вода соответствует нормативам' 
        : '⚠️ Обнаружены отклонения от норм';
      
      const grid = document.getElementById('user-params');
      grid.innerHTML = params.map(p => 
        `<div class="param-card ${p.status}"><strong>${p.key.toUpperCase()}</strong><br>${p.msg}</div>`
      ).join('');
      
      const recs = [];
      if(overall !== 'normal') {
        if(params.some(p => p.key === 'nitrates' && p.status !== 'normal')) 
          recs.push('Установить фильтр обратного осмоса или систему денитрификации.');
        if(params.some(p => p.key === 'cod' && p.status !== 'normal')) 
          recs.push('Провести аэрацию воды, проверить источники органических стоков.');
        if(params.some(p => p.key === 'phosphates' && p.status !== 'normal')) 
          recs.push('Ограничить внесение удобрений вблизи водоёма, рассмотреть сорбционные фильтры.');
      } else {
        recs.push('Продолжать регулярный мониторинг. Вода безопасна для хозяйственно-бытового использования.');
      }
      document.getElementById('recommendations').innerHTML = recs.map(r => `<li>${r}</li>`).join('');
    }

    // 🔐 АВТОРИЗАЦИЯ & РОУТИНГ
    let isLogin = true;
    const modal = document.getElementById('auth-modal');
    
    document.getElementById('btn-login').onclick = () => modal.classList.remove('hidden');
    document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');
    
    document.getElementById('auth-switch-link').onclick = (e) => {
      e.preventDefault();
      isLogin = !isLogin;
      document.getElementById('auth-title').textContent = isLogin ? 'Вход в систему' : 'Регистрация';
      document.getElementById('auth-action').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
      document.getElementById('auth-switch-text').textContent = isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
      document.getElementById('auth-switch-link').textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
      document.getElementById('role-select').classList.toggle('hidden', isLogin);
    };

    document.getElementById('auth-action').onclick = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const role = document.getElementById('role-select').value;
      try {
        if(isLogin) {
          await auth.signInWithEmailAndPassword(email, pass);
        } else {
          const cred = await auth.createUserWithEmailAndPassword(email, pass);
          await db.collection('users').doc(cred.user.uid).set({ 
            email, 
            role, 
            createdAt: firebase.firestore.FieldValue.serverTimestamp() 
          });
        }
        modal.classList.add('hidden');
      } catch(e) {
        alert('Ошибка: ' + e.message);
      }
    };

    document.getElementById('btn-logout').onclick = () => auth.signOut();

    auth.onAuthStateChanged(async user => {
      if(!user) {
        document.getElementById('btn-login').classList.remove('hidden');
        document.getElementById('header-controls').classList.add('hidden');
        document.getElementById('user-view').classList.add('hidden');
        document.getElementById('admin-view').classList.add('hidden');
        stopEmulator();
        return;
      }
      
      document.getElementById('btn-login').classList.add('hidden');
      document.getElementById('header-controls').classList.remove('hidden');
      
      const userDoc = await db.collection('users').doc(user.uid).get();
      const role = userDoc.exists ? userDoc.data().role : 'user';
      document.getElementById('user-role').textContent = role === 'admin' ? '👑 Администратор' : '👤 Пользователь';
      
      document.getElementById('user-view').classList.toggle('hidden', role !== 'user');
      document.getElementById('admin-view').classList.toggle('hidden', role !== 'admin');
      
      if(role === 'admin') {
        initCharts();
        startEmulator();
        loadAdminHistory();
      } else {
        loadUserLatest();
      }
    });

    // Загрузка истории для админа
    function loadAdminHistory() {
      db.collection('water_readings')
        .orderBy('timestamp', 'desc')
        .limit(15)
        .onSnapshot(snap => {
          document.querySelector('#data-table tbody').innerHTML = '';
          snap.forEach(doc => {
            const data = doc.data();
            addUserTableRow(data);
            updateAdminCharts(data);
          });
        });
    }

    // Загрузка последних данных для пользователя
    function loadUserLatest() {
      db.collection('water_readings')
        .orderBy('timestamp', 'desc')
        .limit(1)
        .onSnapshot(snap => {
          if(!snap.empty) renderUserView(snap.docs[0].data());
        });
    }
  </script>
</body>
</html>
